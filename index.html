<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kneehab · Readiness &amp; Recovery</title>
<meta name="theme-color" content="#10161D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="brand">Kneehab<small>Post-meniscectomy · medial meniscus</small></div>
    <div class="top-right" id="top-right"></div>
  </div>
  <nav class="tabs" id="tabs">
    <button data-tab="today" class="on">Today</button>
    <button data-tab="log">Log</button>
    <button data-tab="garmin">Garmin</button>
    <button data-tab="symmetry">Symmetry</button>
    <button data-tab="protocol">Protocol</button>
    <button data-tab="settings">Settings</button>
  </nav>
</header>

<main class="wrap">
  <section id="tab-today"></section>
  <section id="tab-log" class="hidden"></section>
  <section id="tab-garmin" class="hidden"></section>
  <section id="tab-symmetry" class="hidden"></section>
  <section id="tab-protocol" class="hidden"></section>
  <section id="tab-settings" class="hidden"></section>
  <p class="foot">General training guidance, not medical advice. Progress per your surgeon and PT's clearance.<br>All data stays in this browser. Export regularly.</p>
</main>

<div id="timerbar"><b id="tb-time">0:00</b><span id="tb-label">Rest timer, tap to cancel</span></div>

<script type="module" src="app.js"></script>
</body>
</html>
